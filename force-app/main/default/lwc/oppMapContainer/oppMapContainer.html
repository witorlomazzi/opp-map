<template>
    <div class="op-shell">
        <div class="op-header">
            <div class="op-header-title">
                <div class="op-icon-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"></path>
                        <circle cx="12" cy="10" r="2.5"></circle>
                    </svg>
                </div>
                <div>
                    <h1>
                        Mapa de Oportunidades
                        <span class="op-count-pill"><span class="op-dot"></span>{markerCount} no mapa</span>
                    </h1>
                    <p>Distribuição geográfica do pipeline, com filtros dinâmicos</p>
                </div>
            </div>
            <div class="op-actions">
                <button class="op-btn" onclick={handleExportCsv} disabled={loading}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5v9m0 0-3.5-3.5M12 14l3.5-3.5"></path>
                        <path d="M5 16.5V18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1.5"></path>
                    </svg>
                    Exportar CSV
                </button>
                <button class="op-btn op-btn-primary" onclick={handleRequestGeocoding}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                        <path d="M21 3v6h-6"></path>
                    </svg>
                    Geocodificar pendentes
                </button>
            </div>
        </div>

        <div class="op-sidebar">
            <div class="op-tab-bar">
                <button class={filtersTabClass} data-tab="filters" onclick={handleTabClick}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 6h16M7 12h10M10 18h4"></path>
                    </svg>
                    Filtros
                </button>
                <button class={tableTabClass} data-tab="table" onclick={handleTabClick}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                        <path d="M3 10h18M9 10v10"></path>
                    </svg>
                    Tabela
                    <span class="op-tab-count">{markerCount}</span>
                </button>
                <template lwc:if={hasSelectedAccount}>
                    <button class={accountTabClass} data-tab="account" onclick={handleTabClick}>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"></path>
                            <circle cx="12" cy="10" r="2.5"></circle>
                        </svg>
                        Conta
                    </button>
                </template>
            </div>

            <div class="op-tab-content">
                <template lwc:if={isFiltersTab}>
                    <c-opp-map-filter-panel onfilterchange={handleFilterChange}></c-opp-map-filter-panel>
                </template>
                <template lwc:if={isTableTab}>
                    <div class="op-table-search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="7"></circle>
                            <path d="m21 21-4.3-4.3"></path>
                        </svg>
                        <input type="search" placeholder="Buscar por conta, oportunidade, estágio ou produto..."
                            value={tableSearchTerm} oninput={handleTableSearch} />
                    </div>
                    <table class="op-table" aria-label="Oportunidades no mapa">
                        <thead>
                            <tr>
                                <th scope="col">Conta</th>
                                <th scope="col">Oportunidade</th>
                                <th scope="col">Valor</th>
                                <th scope="col">Estágio</th>
                                <th scope="col">Produto</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={tableRows} for:item="m">
                                <tr key={m.oppId} data-opp-id={m.oppId} tabindex="0"
                                    onclick={handleRowClick} onkeydown={handleRowKeydown}>
                                    <td title={m.accountNameFull}>{m.accountName}</td>
                                    <td title={m.nameFull}>{m.name}</td>
                                    <td><lightning-formatted-number value={m.amount} format-style="currency"></lightning-formatted-number></td>
                                    <td>{m.stageName}</td>
                                    <td>{m.mainProduct}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                    <template lwc:if={hasNoTableMatches}>
                        <p class="op-table-empty">Nenhum resultado para "{tableSearchTerm}".</p>
                    </template>
                </template>
                <template lwc:if={isAccountTab}>
                    <div class="op-account-panel">
                        <div class="op-account-header">
                            <h2>{selectedAccount.accountName}</h2>
                            <p>{selectedAccount.opportunities.length} oportunidade(s)</p>
                        </div>
                        <template for:each={selectedAccount.opportunities} for:item="opp">
                            <div key={opp.oppId} class="op-opp-card">
                                <div class="op-opp-card-name">{opp.name}</div>
                                <div class="op-opp-card-row">
                                    <lightning-formatted-number class="op-opp-card-amount"
                                        value={opp.amount} format-style="currency"></lightning-formatted-number>
                                    <span class={opp.badgeClass}>{opp.stageName}</span>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>

        <div class="op-map-card">
            <template lwc:if={error}>
                <div class="op-banner op-banner-error" role="alert">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M12 8v5m0 3h.01"></path>
                    </svg>
                    {error}
                </div>
            </template>
            <template lwc:elseif={truncated}>
                <div class="op-banner" role="alert">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path>
                    </svg>
                    Mostrando apenas os primeiros {markerCount} registros — refine seus filtros.
                </div>
            </template>
            <template lwc:if={geocodeMessage}>
                <div class="op-banner op-banner-info">{geocodeMessage}</div>
            </template>
            <template lwc:if={loading}>
                <div class="op-loading-overlay">
                    <lightning-spinner alternative-text="Carregando" size="medium"></lightning-spinner>
                </div>
            </template>

            <c-opp-map markers={markers} onboundsfilter={handleBoundsFilter}
                onaccountopportunities={handleAccountSelected} lwc:ref="map"></c-opp-map>

            <div class="op-map-footer">
                <span>{markerCount} oportunidade(s) no mapa</span>
                <div class="op-legend">
                    <div class="op-legend-item"><span class="op-legend-dot op-legend-dot-open"></span>Aberta</div>
                    <div class="op-legend-item"><span class="op-legend-dot op-legend-dot-won"></span>Ganha</div>
                    <div class="op-legend-item"><span class="op-legend-dot op-legend-dot-lost"></span>Perdida</div>
                </div>
            </div>
        </div>
    </div>
</template>

<template>
    <div class="op-map-toolbar">
        <button class={heatmapButtonClass} title={toggleLabel} onclick={handleToggleHeatmap}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2C8 6 5 9.5 5 13.5A7 7 0 0 0 19 13.5C19 9.5 16 6 12 2Z"></path>
            </svg>
        </button>
        <button class="op-icon-btn" title="Filtrar pela área visível" onclick={handleFilterByView}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <path d="M10 10l4 4"></path>
            </svg>
        </button>
        <button class="op-icon-btn" title="Limpar área" onclick={handleClearBounds}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 6l12 12M18 6 6 18"></path>
            </svg>
        </button>
        <button class={tableButtonClass} title={tableToggleLabel} onclick={handleToggleTable}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                <path d="M3 10h18M9 10v10"></path>
            </svg>
        </button>
    </div>

    <div class="map-root" role="application" aria-label="Mapa de oportunidades"></div>

    <template lwc:if={showEmptyState}>
        <div class="op-empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"></path>
                <circle cx="12" cy="10" r="2.5"></circle>
            </svg>
            <p>Nenhuma oportunidade geolocalizada encontrada para os filtros atuais.</p>
        </div>
    </template>

    <template lwc:if={showTable}>
        <table class="op-table" aria-label="Oportunidades no mapa">
            <thead>
                <tr>
                    <th scope="col">Conta</th>
                    <th scope="col">Oportunidade</th>
                    <th scope="col">Valor</th>
                    <th scope="col">Estágio</th>
                    <th scope="col">Produto</th>
                </tr>
            </thead>
            <tbody>
                <template for:each={markers} for:item="m">
                    <tr key={m.oppId}>
                        <td>{m.accountName}</td>
                        <td>{m.name}</td>
                        <td><lightning-formatted-number value={m.amount} format-style="currency"></lightning-formatted-number></td>
                        <td>{m.stageName}</td>
                        <td>{m.mainProduct}</td>
                    </tr>
                </template>
            </tbody>
        </table>
    </template>
</template>

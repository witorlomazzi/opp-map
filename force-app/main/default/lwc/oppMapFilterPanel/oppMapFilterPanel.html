<template>
    <div class="op-filter-card">
        <template lwc:if={error}>
            <div class="op-filter-error" role="alert">{error}</div>
        </template>

        <lightning-accordion allow-multiple-sections-open active-section-name={activeSections}
            onsectiontoggle={handleSectionToggle} class="op-accordion">
            <lightning-accordion-section name="closeDate" label="Fechamento">
                <div class="op-field-row">
                    <lightning-input type="date" variant="label-hidden" label="Fechamento de" name="closeDateFrom"
                        value={closeDateFrom} onchange={handleInput}></lightning-input>
                    <lightning-input type="date" variant="label-hidden" label="Fechamento até" name="closeDateTo"
                        value={closeDateTo} onchange={handleInput}></lightning-input>
                </div>
            </lightning-accordion-section>

            <lightning-accordion-section name="amount" label="Valor">
                <div class="op-field-row">
                    <lightning-input type="number" variant="label-hidden" label="Valor mínimo" name="minAmount"
                        placeholder="Mínimo" formatter="currency" value={minAmount} onchange={handleInput}></lightning-input>
                    <lightning-input type="number" variant="label-hidden" label="Valor máximo" name="maxAmount"
                        placeholder="Máximo" formatter="currency" value={maxAmount} onchange={handleInput}></lightning-input>
                </div>
            </lightning-accordion-section>

            <lightning-accordion-section name="status" label="Situação">
                <div class="op-chip-group">
                    <template for:each={wonLostOptions} for:item="opt">
                        <button key={opt.value} type="button" class={opt.chipClass} data-value={opt.value}
                            onclick={handleWonLostChip}>{opt.label}</button>
                    </template>
                </div>
            </lightning-accordion-section>

            <lightning-accordion-section name="stages" label="Estágios">
                <lightning-dual-listbox variant="label-hidden" label="Estágios" name="stages" options={stages}
                    value={selectedStages} size="4" onchange={handleInput}></lightning-dual-listbox>
            </lightning-accordion-section>

            <template lwc:if={hasRecordTypes}>
                <lightning-accordion-section name="recordTypes" label="Tipos de registro">
                    <lightning-dual-listbox variant="label-hidden" label="Tipos de registro" name="recordTypes"
                        options={recordTypes} value={selectedRecordTypes} size="3"
                        onchange={handleInput}></lightning-dual-listbox>
                </lightning-accordion-section>
            </template>

            <template lwc:if={hasProducts}>
                <lightning-accordion-section name="products" label="Produtos">
                    <lightning-dual-listbox variant="label-hidden" label="Produtos" name="products" options={products}
                        value={selectedProducts} size="4" onchange={handleInput}></lightning-dual-listbox>
                </lightning-accordion-section>
            </template>

            <lightning-accordion-section name="cycleAge" label="Idade do ciclo (dias)">
                <div class="op-field-row">
                    <lightning-input type="number" variant="label-hidden" label="Idade mínima do ciclo (dias)"
                        placeholder="Mínima" name="minCycleAgeDays"
                        value={minCycleAgeDays} onchange={handleInput}></lightning-input>
                    <lightning-input type="number" variant="label-hidden" label="Idade máxima do ciclo (dias)"
                        placeholder="Máxima" name="maxCycleAgeDays"
                        value={maxCycleAgeDays} onchange={handleInput}></lightning-input>
                </div>
            </lightning-accordion-section>

            <template for:each={multipicklistFilters} for:item="filter">
                <lightning-accordion-section key={filter.apiName} name={filter.apiName} label={filter.label}>
                    <lightning-dual-listbox variant="label-hidden" label={filter.label} data-field={filter.apiName}
                        options={filter.options} value={filter.selected} size="4"
                        onchange={handleMultipicklistChange}></lightning-dual-listbox>
                    <lightning-radio-group class="op-mode-toggle" variant="label-hidden" label="Modo"
                        data-field={filter.apiName} options={modeOptions} value={filter.mode} type="button"
                        onchange={handleModeChange}></lightning-radio-group>
                </lightning-accordion-section>
            </template>
        </lightning-accordion>

        <button class="op-clear-btn" onclick={handleClear}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"></path>
            </svg>
            Limpar filtros
        </button>
    </div>
</template>
